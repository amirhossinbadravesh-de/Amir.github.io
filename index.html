*{box-sizing:border-box}

body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  color:#fff;
  min-height:100vh;
  overflow-x:hidden;
  background:

body:before,body:after{
  content:"";

  inset:0;
  pointer-events:none;
  z-index:-1;
